<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Endpoints and Files</title>
</head>
<body>
    <h1>Available Endpoints and Public Files</h1>
    <div id="endpoints"></div>

    <script>
        // Function to fetch the /end endpoint and display its contents
        async function loadEndpoints() {
            try {
                const response = await fetch('/end');
                const data = await response.text(); // Get the HTML response as text
                document.getElementById('endpoints').innerHTML = data; // Insert the data into the page
            } catch (error) {
                console.error('Error fetching endpoints:', error);
                document.getElementById('endpoints').textContent = 'Error loading endpoints.';
            }
        }

        // Call the function when the page loads
        window.onload = loadEndpoints;
    </script>
</body>
</html>
